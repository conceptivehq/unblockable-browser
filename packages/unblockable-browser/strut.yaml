package: conceptive/unblockable-browser
version: 0.3.0
description: Strut's unblockable browser, a visible Chromium in one container that Strut drives through Browser MCP over HTTP (BROWSER_MCP_URL and BROWSER_MCP_TOKEN), plus four workflows built from Strut's browser steps (check the browser, read a page, search a site, explore with an agent).
